<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1A1215">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Florea">
<meta name="apple-mobile-web-app-title" content="Florea">
<title>Florea</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#1A1215;--bg2:#221B1E;--card:#2A2225;--card2:#312A2D;--fg:#F5EDE8;--fg2:#B0A3A7;--fg3:#6E6266;--ac:#E87461;--ac2:rgba(232,116,97,.12);--ac3:rgba(232,116,97,.25);--pk:#D4729A;--pk2:rgba(212,114,154,.12);--gn:#6BCB8B;--gn2:rgba(107,203,139,.12);--yl:#F0C75E;--yl2:rgba(240,199,94,.12);--bl:#7BA4C9;--bl2:rgba(123,164,201,.12);--pp:#A78BFA;--pp2:rgba(167,139,250,.12);--rd:#E74C3C;--rd2:rgba(231,76,60,.1);--r:16px;--rs:10px;--rx:6px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--fg);min-height:100dvh;overflow-x:hidden}
.wrap{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}

/* Header */
.hd{padding:16px 20px 0;display:flex;justify-content:space-between;align-items:center}
.hd-logo{display:flex;align-items:center;gap:9px}
.hd-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--ac),var(--pk));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.hd-text{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--fg)}
.hd-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--fg3);background:var(--bg2);color:var(--fg3);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px}
.hd-btn:active{transform:scale(.92)}

/* Container de páginas */
.cnt{flex:1;padding:16px 20px 100px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pg{display:none;animation:pgIn .25s ease}.pg.on{display:block}
@keyframes pgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Cards genéricos */
.c{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:12px;border:1px solid rgba(255,255,255,.03)}
.c-t{font-size:11px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:14px}

/* Hero */
.hero{background:linear-gradient(135deg,var(--card),var(--ac2));border:1px solid var(--ac3);position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:-40%;right:-25%;width:160px;height:160px;background:radial-gradient(circle,var(--ac3),transparent 70%);pointer-events:none}
.hero-phase{font-family:'Playfair Display',serif;font-size:26px;font-weight:900;position:relative;line-height:1.2}
.hero-sub{font-size:13px;color:var(--fg2);font-weight:300;margin-top:4px;position:relative}
.hero-row{display:flex;gap:10px;margin-top:16px;position:relative}
.hero-stat{flex:1;background:rgba(0,0,0,.2);border-radius:var(--rs);padding:10px 6px;text-align:center}
.hero-sv{font-size:22px;font-weight:800;color:var(--ac)}
.hero-sl{font-size:9px;color:var(--fg3);margin-top:1px;text-transform:uppercase;letter-spacing:.5px}
.hero-bar{height:4px;background:rgba(255,255,255,.05);border-radius:2px;margin-top:14px;overflow:hidden}
.hero-fill{height:100%;background:linear-gradient(90deg,var(--ac),var(--pk));border-radius:2px;transition:width .6s}

/* Medicamento strip */
.med-strip{display:flex;gap:6px;margin-bottom:12px}
.msi{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;border-radius:var(--rs);background:var(--card);border:1px solid rgba(255,255,255,.03);transition:.2s;position:relative;min-height:72px}
.msi.done{border-color:rgba(107,203,139,.25);background:var(--gn2)}
.msi.done .ms-c{color:var(--gn);opacity:1}
.ms-n{font-size:9px;font-weight:600;color:var(--fg2);text-align:center;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ms-t{font-size:9px;color:var(--fg3)}
.ms-c{font-size:16px;color:var(--fg3);opacity:.2;transition:.3s}
.ms-b{position:absolute;inset:0;border:none;background:transparent;cursor:pointer;border-radius:var(--rs);z-index:2}

/* Mini semana */
.wk-mini{display:flex;gap:4px}
.wk-d{flex:1;text-align:center}
.wk-dn{font-size:9px;color:var(--fg3);font-weight:500;padding:2px 0}
.wk-dd{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;margin:2px auto 0;color:var(--fg2)}
.wk-dd.today{background:var(--ac);color:#fff;font-weight:700}
.wk-dd.menstr{background:var(--pk2);color:var(--pk)}
.wk-dd.pause{border:1.5px dashed rgba(240,199,94,.3);color:var(--yl)}

/* Sintomas */
.sym-row{display:flex;flex-wrap:wrap;gap:6px}
.sc{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:500;background:rgba(255,255,255,.03);color:var(--fg3);border:1px solid rgba(255,255,255,.04);cursor:pointer;transition:.2s}
.sc.on{background:var(--ac2);color:var(--ac);border-color:var(--ac3)}
.sc i{font-size:11px}

/* Dica do dia */
.tip-d{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:var(--rx);padding:10px 12px;margin-top:10px}
.tip-h{font-size:10px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.tip-h i{color:var(--ac);font-size:9px}
.tip-x{font-size:11px;color:var(--fg3);line-height:1.5}
.tip-m{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--gn);margin-top:4px}
.tip-w{font-size:10px;color:var(--yl);display:flex;align-items:flex-start;gap:5px;margin-top:6px;line-height:1.4}
.tip-w i{flex-shrink:0;margin-top:2px;font-size:9px}

/* Calendário */
.cal-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cal-mo{font-family:'Playfair Display',serif;font-size:18px;font-weight:700}
.cal-nav{display:flex;gap:4px}
.cal-nb{width:30px;height:30px;border-radius:50%;border:1px solid var(--fg3);background:transparent;color:var(--fg3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px}
.cal-nb:active{border-color:var(--ac);color:var(--ac)}
.cal-wk{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px}
.cal-wd{text-align:center;font-size:10px;color:var(--fg3);font-weight:500;padding:4px 0}
.cal-ds{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cd{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:13px;cursor:pointer;transition:.15s;position:relative;color:var(--fg2)}
.cd:active{transform:scale(.9)}
.cd.om{color:var(--fg3);opacity:.25;pointer-events:none}
.cd.td{background:var(--ac);color:#fff;font-weight:700}
.cd.pm{background:var(--pk2);color:var(--pk);font-weight:600}
.cd.pm.td{background:var(--ac);color:#fff}
.cd.lm::after{content:'';position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--ac)}
.cd.lm.td::after{background:#fff}
.cd.mp{border:1.5px dashed rgba(240,199,94,.3)}
.cd.mp.td{border:none}
.cd.sel{outline:2px solid var(--ac);outline-offset:1px}
.cal-leg{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.cal-li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--fg3)}
.cal-ld{width:7px;height:7px;border-radius:50%}
.cal-ll{width:10px;border-top:1.5px dashed var(--yl);opacity:.5}

/* Logs rápidos */
.lr{display:flex;gap:8px;margin-bottom:12px}
.lb{flex:1;padding:10px;border-radius:var(--rx);border:1px solid rgba(255,255,255,.05);background:transparent;color:var(--fg3);cursor:pointer;transition:.2s;font-family:'Outfit',sans-serif;font-size:12px;font-weight:500;text-align:center}
.lb.og{border-color:var(--gn);background:var(--gn2);color:var(--gn)}
.lb.ya{border-color:var(--yl);background:var(--yl2);color:var(--yl)}
.lb.aa{border-color:var(--ac);background:var(--ac2);color:var(--ac)}
.lb.bl{border-color:var(--bl);background:var(--bl2);color:var(--bl)}

/* Input de texto (nota) — era .ni conflitante, agora .nt */
.nt{width:100%;background:rgba(0,0,0,.15);border:1px solid rgba(255,255,255,.04);border-radius:var(--rx);padding:10px;color:var(--fg);font-family:'Outfit',sans-serif;font-size:13px;outline:none;transition:border .2s;min-height:50px;resize:none}
.nt:focus{border-color:var(--ac3)}.nt::placeholder{color:var(--fg3)}

/* Botões */
.bp{width:100%;padding:13px;border:none;border-radius:var(--rs);background:linear-gradient(135deg,var(--ac),var(--pk));color:#fff;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;margin-top:14px}
.bp:active{transform:scale(.97)}
.bo{background:transparent;border:1px solid var(--fg3);color:var(--fg3);margin-top:8px}
.bd{background:linear-gradient(135deg,#c0392b,#e74c3c)}

/* Medicação card */
.mc{background:var(--card);border-radius:var(--r);border:1px solid rgba(255,255,255,.03);margin-bottom:8px;overflow:hidden;transition:.15s}
.mc:active{transform:scale(.985)}
.mc-t{display:flex;align-items:center;gap:12px;padding:14px}
.mc-i{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.mc-f{flex:1;min-width:0}.mc-n{font-weight:600;font-size:14px;line-height:1.3}.mc-d{font-size:11px;color:var(--fg3);margin-top:1px}
.mc-time{font-size:11px;color:var(--fg3);opacity:.7;margin-top:1px}
.mb{display:inline-flex;align-items:center;gap:3px;font-size:9px;padding:2px 7px;border-radius:8px;margin-top:3px;font-weight:600}
.mb.ct{background:var(--pp2);color:var(--pp)}.mb.cy{background:var(--yl2);color:var(--yl)}
.ma{display:flex;gap:4px;align-items:center;flex-shrink:0}
.ab{width:28px;height:28px;border-radius:50%;border:none;background:transparent;color:var(--fg3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:.15s}
.ab:active{transform:scale(.85)}.ab.ed:hover{color:var(--bl)}.ab.dl:hover{color:var(--rd)}

/* Check mark */
.mk{width:32px;height:32px;border-radius:50%;border:2px solid var(--fg3);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;transition:.3s;font-size:13px;flex-shrink:0}
.mk.tk{border-color:var(--gn);background:var(--gn);color:#fff;animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.2)}100%{transform:scale(1)}}

/* Ciclo visual */
.mcy{padding:0 14px 12px}
.cy-lb{display:flex;justify-content:space-between;font-size:10px;margin-bottom:4px}
.cy-lt{color:var(--gn)}.cy-lp{color:var(--yl)}
.cy-tk{height:6px;border-radius:3px;overflow:hidden;display:flex;background:rgba(255,255,255,.03);position:relative}
.cy-tf{background:var(--gn);transition:width .5s;border-radius:3px 0 0 3px}.cy-tf.act{box-shadow:0 0 6px rgba(107,203,139,.3)}
.cy-tp{background:var(--yl2);transition:width .5s;border-radius:0 3px 3px 0}.cy-tp.act{background:var(--yl);box-shadow:0 0 6px rgba(240,199,94,.3)}
.cy-dot{width:10px;height:10px;background:var(--fg);border:2px solid var(--card);border-radius:50%;position:absolute;top:-2px;transform:translateX(-50%);z-index:2;box-shadow:0 0 4px rgba(0,0,0,.5)}
.cy-i{display:flex;justify-content:space-between;align-items:center;margin-top:5px}
.cy-s{font-size:10px;font-weight:600;padding:2px 7px;border-radius:8px}
.cy-s.tk{background:var(--gn2);color:var(--gn)}.cy-s.ps{background:var(--yl2);color:var(--yl)}
.cy-dl{font-size:10px;color:var(--fg3)}
.cy-ct{background:var(--pp2);color:var(--pp);font-size:10px;font-weight:600;padding:2px 7px;display:inline-block}

/* Progresso */
.pr{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.pr-b{flex:1;height:3px;background:rgba(255,255,255,.04);border-radius:2px;overflow:hidden}
.pr-f{height:100%;background:var(--gn);border-radius:2px;transition:width .5s}
.pr-t{font-size:11px;color:var(--fg3);white-space:nowrap}

/* Chart barras */
.ch{display:flex;align-items:flex-end;gap:3px;height:50px}
.cb{flex:1;border-radius:2px 2px 0 0;min-height:3px;transition:height .5s}

/* Insight header */
.ih{font-size:11px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.ih i{font-size:12px}

/* Insight row */
.ir{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.03)}.ir:last-child{border-bottom:none}
.ii{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.if{flex:1}.it{font-weight:600;font-size:13px}.id{font-size:11px;color:var(--fg3);margin-top:1px}
.ib{height:3px;background:rgba(255,255,255,.04);border-radius:2px;overflow:hidden;margin-top:4px}
.ib-f{height:100%;border-radius:2px;transition:width .4s}

/* Settings item */
.si{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.03)}.si:last-child{border-bottom:none}
.sl{display:flex;align-items:center;gap:10px}
.sl i{width:18px;text-align:center;color:var(--fg3);font-size:14px}
.sl span{font-size:13px}
.sv{font-size:12px;color:var(--fg3);display:flex;align-items:center;gap:5px;cursor:pointer}

/* Toggle */
.tgl{width:42px;height:24px;background:var(--fg3);border-radius:12px;position:relative;cursor:pointer;transition:.3s;border:none}
.tgl.on{background:var(--ac)}.tgl::after{content:'';width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:.3s}.tgl.on::after{transform:translateX(18px)}

/* Form */
.fi{width:100%;padding:10px;background:rgba(0,0,0,.15);border:1px solid rgba(255,255,255,.04);border-radius:var(--rx);color:var(--fg);font-family:'Outfit',sans-serif;font-size:13px;outline:none;transition:border .2s}
.fi:focus{border-color:var(--ac3)}
.fg{margin-bottom:12px}
.fl{font-size:11px;color:var(--fg3);font-weight:500;margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.5px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tt{display:flex;gap:8px;margin-top:4px}
.tb{flex:1;padding:12px 8px;border-radius:var(--rs);border:1px solid rgba(255,255,255,.05);background:transparent;color:var(--fg3);cursor:pointer;transition:.2s;font-family:'Outfit',sans-serif;font-size:12px;text-align:center}
.tb.on{border-color:var(--ac);background:var(--ac2);color:var(--ac)}
.tb i{display:block;font-size:18px;margin-bottom:4px}.tb small{font-size:9px;opacity:.6}

/* Modal */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.mo.show{display:flex}
.mo-full{align-items:center!important}
.ms{background:var(--bg2);border-radius:var(--r) var(--r) 0 0;padding:20px 18px 36px;width:100%;max-width:430px;max-height:85vh;overflow-y:auto;animation:slUp .25s ease}
.mo-full .ms{border-radius:var(--r);max-height:90vh;margin:16px}
@keyframes slUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mh{width:32px;height:3px;background:var(--fg3);border-radius:2px;margin:0 auto 16px;opacity:.5}
.mt{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;margin-bottom:16px}

/* Toast */
.tc{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none;width:88%;max-width:380px}
.ts{background:var(--card2);border:1px solid rgba(255,255,255,.06);border-radius:var(--rx);padding:12px 16px;font-size:12px;color:var(--fg);box-shadow:0 4px 20px rgba(0,0,0,.3);animation:tI .25s ease,tO .25s ease 3.5s forwards;pointer-events:auto;display:flex;align-items:center;gap:8px}
@keyframes tI{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes tO{to{opacity:0;transform:translateY(-8px)}}

/* Alerta de pausa */
.ao{position:fixed;inset:0;z-index:10000;background:rgba(26,18,21,.95);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:40px}
.ao.show{display:flex;animation:ap 2s ease-in-out infinite}
@keyframes ap{0%,100%{background:rgba(26,18,21,.95)}50%{background:rgba(232,116,97,.08)}}
.ai{width:70px;height:70px;border-radius:50%;background:var(--ac2);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--ac);animation:as .4s ease-in-out infinite}
@keyframes as{0%,100%{transform:rotate(0)}25%{transform:rotate(12deg)}75%{transform:rotate(-12deg)}}
.at{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;text-align:center}
.an{font-size:15px;color:var(--ac);text-align:center}
.ad{font-size:13px;color:var(--fg3);text-align:center}
.ab2{padding:13px 44px;border:none;border-radius:var(--rs);background:linear-gradient(135deg,var(--ac),var(--pk));color:#fff;font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}

/* Bottom nav — .ni usado apenas aqui */
.bn{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(26,18,21,.94);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.04);display:flex;padding:6px 0 max(6px,env(safe-area-inset-bottom));z-index:100}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;cursor:pointer;color:var(--fg3);transition:.2s;border:none;background:none;font-family:'Outfit',sans-serif}
.ni i{font-size:18px;transition:.2s}.ni span{font-size:9px;font-weight:500}
.ni.on{color:var(--ac)}.ni.on i{transform:scale(1.08)}

/* FAB */
.fb{position:fixed;bottom:82px;right:max(16px,calc((100vw-430px)/2+16px));width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--pk));border:none;color:#fff;font-size:20px;cursor:pointer;box-shadow:0 4px 16px var(--ac3);z-index:99;display:flex;align-items:center;justify-content:center;transition:.2s}
.fb:active{transform:scale(.88)}

/* Empty state */
.em{text-align:center;padding:30px 20px;color:var(--fg3)}.em i{font-size:32px;margin-bottom:8px;display:block;opacity:.4}.em p{font-size:13px}

/* Prompt banner */
.pb{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);width:calc(100% - 40px);max-width:390px;background:var(--card2);border:1px solid var(--ac3);border-radius:var(--rs);padding:14px 16px;display:none;align-items:center;gap:12px;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,.4);animation:pgIn .3s ease}
.pb.show{display:flex}
.pi{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--pk));display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0}
.pt{flex:1}.pt-t{font-size:13px;font-weight:600}.pt-d{font-size:11px;color:var(--fg3);margin-top:1px}
.px{background:none;border:none;color:var(--fg3);cursor:pointer;font-size:14px;padding:4px;flex-shrink:0}

/* Appt soon */
.appt-soon{background:var(--bl2);border:1px solid rgba(123,164,201,.2);border-radius:var(--rx);padding:10px 12px;margin-bottom:10px;font-size:11px;color:var(--fg2);display:flex;gap:8px;align-items:flex-start}
.appt-soon i{color:var(--bl);margin-top:1px;flex-shrink:0;font-size:12px}

/* Acompanhamento card */
.acard{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.03);align-items:flex-start}
.acard:last-child{border-bottom:none}
.aci{width:50px;height:50px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.acd{flex:1;min-width:0}
.acn{font-size:14px;font-weight:600}
