<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1A1215">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Florea — Ciclo & Saúde</title>
    <link rel="manifest" id="manifest-link">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root{--bg:#1A1215;--bg-elevated:#231C1F;--bg-card:#2C2326;--fg:#F5EDE8;--fg-muted:#8A7B7F;--fg-dim:#5A4E52;--accent:#E87461;--accent-soft:rgba(232,116,97,0.15);--accent-glow:rgba(232,116,97,0.3);--green:#6BCB8B;--green-soft:rgba(107,203,139,0.15);--yellow:#F0C75E;--yellow-soft:rgba(240,199,94,0.15);--blue:#7BA4C9;--blue-soft:rgba(123,164,201,0.15);--pink:#D4729A;--pink-soft:rgba(212,114,154,0.2);--red:#E74C3C;--red-soft:rgba(231,76,60,0.12);--radius:16px;--radius-sm:10px;--radius-xs:6px;--shadow:0 4px 24px rgba(0,0,0,0.3)}
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--fg);min-height:100dvh;overflow-x:hidden;position:relative}
        body::before{content:'';position:fixed;top:-30%;left:-20%;width:70vw;height:70vw;background:radial-gradient(circle,var(--accent-glow)0%,transparent 70%);pointer-events:none;z-index:0;animation:floatBlob 12s ease-in-out infinite}
        body::after{content:'';position:fixed;bottom:-20%;right:-20%;width:60vw;height:60vw;background:radial-gradient(circle,rgba(212,114,154,0.12)0%,transparent 70%);pointer-events:none;z-index:0;animation:floatBlob 15s ease-in-out infinite reverse}
        @keyframes floatBlob{0%,100%{transform:translate(0,0)scale(1)}33%{transform:translate(5%,8%)scale(1.05)}66%{transform:translate(-3%,-5%)scale(0.95)}}
        .app-container{position:relative;z-index:1;max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
        .app-header{padding:20px 20px 0;display:flex;justify-content:space-between;align-items:center}
        .app-logo{display:flex;align-items:center;gap:10px}
        .app-logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--pink));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
        .app-logo-text{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--fg),var(--fg-muted));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .header-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--fg-dim);background:var(--bg-elevated);color:var(--fg-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-size:14px}
        .header-btn:hover{border-color:var(--accent);color:var(--accent)}
        .main-content{flex:1;padding:20px;padding-bottom:100px;overflow-y:auto;scroll-behavior:smooth}
        .page{display:none;animation:fadeIn .3s ease}.page.active{display:block}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .card{background:var(--bg-card);border-radius:var(--radius);padding:20px;border:1px solid rgba(255,255,255,0.04);margin-bottom:16px;transition:transform .2s}
        .card:active{transform:scale(0.98)}
        .card-title{font-size:13px;font-weight:500;color:var(--fg-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
        .phase-hero{background:linear-gradient(135deg,var(--bg-card)0%,rgba(232,116,97,0.08)100%);border:1px solid rgba(232,116,97,0.15);position:relative;overflow:hidden}
        .phase-hero::before{content:'';position:absolute;top:-50%;right:-30%;width:200px;height:200px;background:radial-gradient(circle,var(--accent-glow)0%,transparent 70%);pointer-events:none}
        .phase-name{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;margin-bottom:4px;position:relative}
        .phase-subtitle{color:var(--fg-muted);font-size:14px;font-weight:300;position:relative}
        .phase-stats{display:flex;gap:12px;margin-top:18px;position:relative}
        .phase-stat{flex:1;background:rgba(0,0,0,0.25);border-radius:var(--radius-sm);padding:12px 8px;text-align:center}
        .phase-stat-value{font-size:20px;font-weight:700;color:var(--accent)}
        .phase-stat-label{font-size:10px;color:var(--fg-muted);margin-top:2px}
        .cycle-progress-bar{width:100%;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;margin-top:16px;overflow:hidden}
        .cycle-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--pink));border-radius:3px;transition:width .6s ease}
        .safety-alert{background:var(--red-soft);border:1px solid rgba(231,76,60,0.25);border-radius:var(--radius-sm);padding:14px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
        .safety-alert i{color:var(--red);font-size:16px;margin-top:2px;flex-shrink:0}
        .safety-alert-text{font-size:13px;color:var(--fg);line-height:1.6}
        .safety-alert-text strong{color:var(--red)}
        .info-alert{background:var(--yellow-soft);border:1px solid rgba(240,199,94,0.2);border-radius:var(--radius-sm);padding:14px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
        .info-alert i{color:var(--yellow);font-size:16px;margin-top:2px;flex-shrink:0}
        .info-alert-text{font-size:13px;color:var(--fg);line-height:1.6}
        .info-alert-text strong{color:var(--yellow)}
        .calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
        .calendar-month{font-family:'Playfair Display',serif;font-size:20px;font-weight:700}
        .calendar-nav{display:flex;gap:6px}
        .calendar-nav-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--fg-dim);background:transparent;color:var(--fg-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .2s}
        .calendar-nav-btn:hover{border-color:var(--accent);color:var(--accent)}
        .calendar-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
        .calendar-weekday{text-align:center;font-size:11px;color:var(--fg-dim);font-weight:500;padding:4px 0}
        .calendar-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
        .calendar-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:14px;font-weight:400;cursor:pointer;transition:all .2s;position:relative;color:var(--fg)}
        .calendar-day:hover{background:rgba(255,255,255,0.06)}
        .calendar-day.other-month{color:var(--fg-dim);opacity:0.4}
        .calendar-day.today{background:var(--accent);color:#fff;font-weight:700}
        .calendar-day.predicted-menstruation{background:var(--pink-soft);color:var(--pink);font-weight:600}
        .calendar-day.predicted-menstruation.today{background:var(--accent);color:#fff}
        .calendar-day.logged-menstruation::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
        .calendar-day.logged-menstruation.today::after{background:#fff}
        .calendar-day.med-pause-day{border:1px dashed rgba(240,199,94,0.35);background:rgba(240,199,94,0.06)}
        .calendar-day.med-pause-day.today{background:var(--accent);color:#fff;border:none}
        .calendar-day.selected{outline:2px solid var(--accent);outline-offset:2px}
        .calendar-legend{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
        .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--fg-muted)}
        .legend-dot{width:8px;height:8px;border-radius:50%}
        .legend-line{width:12px;height:0;border-top:2px dashed var(--yellow);opacity:0.6}
        .symptom-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
        .symptom-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--fg-muted);cursor:pointer;transition:all .2s;font-size:10px;font-family:'Outfit',sans-serif}
        .symptom-btn i{font-size:20px;transition:all .2s}
        .symptom-btn.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
        .symptom-btn.active i{transform:scale(1.15)}
        .intensity-row{display:flex;gap:8px;margin-top:16px}
        .intensity-btn{flex:1;height:36px;border-radius:var(--radius-xs);border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--fg-muted);cursor:pointer;transition:all .2s;font-size:12px;font-family:'Outfit',sans-serif}
        .intensity-btn.active-low{border-color:var(--green);background:var(--green-soft);color:var(--green)}
        .intensity-btn.active-med{border-color:var(--yellow);background:var(--yellow-soft);color:var(--yellow)}
        .intensity-btn.active-high{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
        .note-input{width:100%;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius-sm);padding:12px;color:var(--fg);font-family:'Outfit',sans-serif;font-size:14px;resize:none;outline:none;transition:border-color .2s;min-height:60px}
        .note-input:focus{border-color:var(--accent)}.note-input::placeholder{color:var(--fg-dim)}
        .save-btn{width:100%;padding:14px;border:none;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--accent),var(--pink));color:#fff;font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:16px}
        .save-btn:active{transform:scale(0.97)}.save-btn.danger{background:linear-gradient(135deg,#c0392b,#e74c3c)}.save-btn.outline{background:transparent;border:1px solid var(--fg-dim);color:var(--fg-muted);margin-top:8px}
        .med-card{display:flex;flex-direction:column;background:var(--bg-card);border-radius:var(--radius);border:1px solid rgba(255,255,255,0.04);margin-bottom:10px;overflow:hidden;transition:all .2s}
        .med-card-top{display:flex;align-items:center;gap:14px;padding:16px 16px 12px}
        .med-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
        .med-info{flex:1;min-width:0}.med-name{font-weight:600;font-size:15px}.med-dose{font-size:12px;color:var(--fg-muted);margin-top:2px}.med-time{font-size:12px;color:var(--fg-dim);margin-top:1px}
        .med-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
        .med-check{width:32px;height:32px;border-radius:50%;border:2px solid var(--fg-dim);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;transition:all .3s;font-size:14px;flex-shrink:0}
        .med-check.taken{border-color:var(--green);background:var(--green);color:#fff;animation:popIn .3s ease}
        @keyframes popIn{0%{transform:scale(0.5)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
        .med-action-btn{width:28px;height:28px;border-radius:50%;border:none;background:transparent;color:var(--fg-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .2s}
        .med-action-btn:hover{color:var(--fg);background:rgba(255,255,255,0.06)}.med-action-btn.delete:hover{color:var(--accent)}
        .med-cycle-bar{margin:0 16px 12px}
        .med-cycle-label{display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px}
        .med-cycle-label-take{color:var(--green)}.med-cycle-label-pause{color:var(--yellow)}
        .med-cycle-track{width:100%;height:8px;border-radius:4px;overflow:hidden;display:flex;background:rgba(255,255,255,0.04)}
        .med-cycle-take{background:var(--green);transition:width .5s ease;border-radius:4px 0 0 4px}
        .med-cycle-take.active{box-shadow:0 0 8px rgba(107,203,139,0.4)}
        .med-cycle-pause{background:var(--yellow-soft);transition:width .5s ease;border-radius:0 4px 4px 0}
        .med-cycle-pause.active{background:var(--yellow);box-shadow:0 0 8px rgba(240,199,94,0.4)}
        .med-cycle-day-marker{position:relative;height:0}
        .med-cycle-day-dot{width:12px;height:12px;background:var(--fg);border:2px solid var(--bg-card);border-radius:50%;position:absolute;top:-10px;transform:translateX(-50%);z-index:2;box-shadow:0 0 6px rgba(0,0,0,0.5)}
        .med-cycle-info{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
        .med-cycle-status{font-size:11px;font-weight:500;padding:3px 8px;border-radius:12px}
        .med-cycle-status.taking{background:var(--green-soft);color:var(--green)}
        .med-cycle-status.paused{background:var(--yellow-soft);color:var(--yellow)}
        .med-cycle-days-left{font-size:11px;color:var(--fg-dim)}
        .med-progress{display:flex;align-items:center;gap:10px;margin-bottom:16px}
        .med-progress-bar{flex:1;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden}
        .med-progress-fill{height:100%;background:var(--green);border-radius:2px;transition:width .5s ease}
        .med-progress-text{font-size:12px;color:var(--fg-muted);white-space:nowrap}
        .form-group{margin-bottom:14px}
        .form-label{font-size:12px;color:var(--fg-muted);font-weight:500;margin-bottom:6px;display:block}
        .form-input{width:100%;padding:12px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius-sm);color:var(--fg);font-family:'Outfit',sans-serif;font-size:14px;outline:none;transition:border-color .2s}
        .form-input:focus{border-color:var(--accent)}.form-select option{background:var(--bg-card);color:var(--fg)}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
        .insight-card{display:flex;align-items:center;gap:14px;padding:16px;background:var(--bg-card);border-radius:var(--radius);border:1px solid rgba(255,255,255,0.04);margin-bottom:10px}
        .insight-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
        .insight-info{flex:1}.insight-title{font-weight:600;font-size:14px}.insight-desc{font-size:12px;color:var(--fg-muted);margin-top:2px}
        .mini-chart{display:flex;align-items:flex-end;gap:3px;height:60px;padding:0 4px}
        .mini-chart-bar{flex:1;background:linear-gradient(to top,var(--accent),var(--pink));border-radius:3px 3px 0 0;min-height:4px;transition:height .5s ease;opacity:0.7}
        .settings-item{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
        .settings-item:last-child{border-bottom:none}
        .settings-label{display:flex;align-items:center;gap:12px}
        .settings-label i{width:20px;text-align:center;color:var(--fg-muted);font-size:16px}
        .settings-label span{font-size:14px}
        .settings-value{font-size:13px;color:var(--fg-muted);display:flex;align-items:center;gap:6px;cursor:pointer}
        .toggle{width:46px;height:26px;background:var(--fg-dim);border-radius:13px;position:relative;cursor:pointer;transition:background .3s;border:none}
        .toggle.on{background:var(--accent)}
        .toggle::after{content:'';width:20px;height:20px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:transform .3s}
        .toggle.on::after{transform:translateX(20px)}
        .toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:90%;max-width:400px}
        .toast{background:var(--bg-card);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius-sm);padding:14px 18px;font-size:13px;color:var(--fg);box-shadow:var(--shadow);animation:toastIn .3s ease,toastOut .3s ease 4s forwards;pointer-events:auto;display:flex;align-items:flex-start;gap:10px}
        @keyframes toastIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
        @keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(-10px)}}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
        .modal-overlay.show{display:flex}
        .modal-full{align-items:center!important}
        .modal-sheet{background:var(--bg-elevated);border-radius:var(--radius) var(--radius) 0 0;padding:24px 20px 40px;width:100%;max-width:430px;max-height:85vh;overflow-y:auto;animation:slideUp .3s ease}
        .modal-full .modal-sheet{border-radius:var(--radius);max-height:90vh;margin:20px}
        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .modal-handle{width:36px;height:4px;background:var(--fg-dim);border-radius:2px;margin:0 auto 20px}
        .modal-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;margin-bottom:20px}
        .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(26,18,21,0.92);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.06);display:flex;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:100}
        .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;cursor:pointer;color:var(--fg-dim);transition:color .2s;border:none;background:none;font-family:'Outfit',sans-serif}
        .nav-item i{font-size:20px;transition:all .2s}.nav-item span{font-size:10px;font-weight:500}
        .nav-item.active{color:var(--accent)}.nav-item.active i{transform:scale(1.1)}
        .fab{position:fixed;bottom:90px;right:max(20px,calc((100vw-430px)/2+20px));width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink));border:none;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 20px var(--accent-glow);z-index:99;display:flex;align-items:center;justify-content:center;transition:all .2s}
        .fab:active{transform:scale(0.9)}
        .empty-state{text-align:center;padding:40px 20px;color:var(--fg-dim)}.empty-state i{font-size:40px;margin-bottom:12px;display:block}.empty-state p{font-size:14px}
        .prediction-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--fg-dim);background:rgba(255,255,255,0.04);padding:3px 8px;border-radius:20px;margin-top:8px}
        .delete-btn{background:none;border:none;color:var(--fg-dim);cursor:pointer;padding:4px;font-size:14px;transition:color .2s}.delete-btn:hover{color:var(--accent)}
        .tip-card{background:linear-gradient(135deg,rgba(232,116,97,0.08),rgba(212,114,154,0.06));border:1px solid rgba(232,116,97,0.12);border-radius:var(--radius);padding:16px;margin-bottom:16px}
        .tip-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
        .tip-header i{color:var(--accent);font-size:16px}.tip-header span{font-size:14px;font-weight:600;color:var(--accent)}
        .tip-body{font-size:13px;color:var(--fg-muted);line-height:1.6}
        .tip-meds{margin-top:10px}
        .tip-med-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(0,0,0,0.2);border-radius:var(--radius-xs);margin-bottom:6px;font-size:12px}
        .tip-med-item i{color:var(--green)
